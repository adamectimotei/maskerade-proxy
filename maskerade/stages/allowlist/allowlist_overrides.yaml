# Hand-maintained overrides — NOT regenerated by build.py.
# Merged with allowlist.yaml at load time (the loader reads every *.yaml here).
# This is where engagement-specific policy and manual keep/drop decisions live,
# so they survive `python maskerade/allowlist/build.py` regenerating allowlist.yaml.

# ── Force-KEEP (never suppress) specific terms, even if a vocab group lists them.
# Use when a client is legitimately named after a technology (e.g. a company
# literally called "Oracle") — listing it here makes the pipeline mask it again.
exclude: []

# ── Type-aware policy filters ────────────────────────────────────────────────
# Applied AFTER vocabulary suppression and BEFORE masking, over the NER-slot
# entity list. Each is a policy choice; toggle per engagement. Custom-stage
# entities are never affected.
policy:

  # A real email address always contains '@'. Drop any EMAIL_ADDRESS detection
  # without one — this is the fix for a field/word that merely CONTAINS "email"
  # (personalEmail, workEmail, "manager email", "14k emails", "openid profile
  # email") being masked as an address. Recall-safe: real emails keep their '@'.
  email_requires_at: true

  # Entity TYPES to drop entirely (out of scope for this engagement).
  # FINANCIAL_DATA is keyval's PII hint over values under salary/income/wage/
  # compensation keys — i.e. bare amounts. Left unmasked per policy.
  # NOTE: this also drops any gold FINANCIAL_DATA, so recall on that type -> 0.
  drop_types:
    - FINANCIAL_DATA

  # Drop SINGLE-WORD (one-token) place names. A bare city/region/timezone name
  # ("Tábor", "CZ-East", "Europe/Stockholm") is public geography, not client
  # PII; multi-word addresses (street + number) are still masked.
  #   LOCATION         -> GLiNER (location/loc/address labels)
  #   PHYSICAL_ADDRESS -> keyval (address/street/city/zip/postal keys)
  # NOTE: also drops any gold single-word LOCATION/PHYSICAL_ADDRESS — verify the
  # per-type recall after enabling. Two-token places ("Praha 3") are NOT dropped.
  drop_single_token_types:
    - LOCATION
    - PHYSICAL_ADDRESS
