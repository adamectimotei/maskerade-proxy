# maskerade — default detection configuration.
#
# DERIVED, not authored: stripped from the original GPU implementation's
# config. Detection settings only. Anything about Anthropic pricing,
# Ollama, Flair, Burp or the hostname stage belongs to that implementation
# and is deliberately absent here — if this file ever needs one of those
# keys back, the package boundary has leaked.
#
# To change a setting, copy this file, edit the copy, and run
# `maskerade proxy --config COPY`. The copy REPLACES this file rather than
# being merged with it, so start from the whole file. This one ships inside
# the package and is overwritten on every upgrade.

# =============================================================================
# Anonymization Pipeline — Configuration
# =============================================================================
# This file controls every aspect of the pipeline.
# Each stage can be toggled on/off independently.
# =============================================================================

# --- Pipeline stages (enable/disable individually) ---
# Keys set here override the tier (fast/full); unset keys come from the tier.
#
# Execution order is fixed in code (maskerade/pipeline.py): custom -> regex
# -> form -> detector slot (gliner, keyval, checksum, id, then org_evidence)
# -> allowlist -> masker -> validator. form and the detector slot read the
# same intermediate text (regex hits already replaced), which is what lets
# the pipeline reconcile overlapping spans across them.
stages:
  # custom: true
  # regex: true
  # form: true          # format standards + entropy
  # gliner: true        # needs maskerade[ner] AND torch
  # keyval: true        # key-driven; its over-masking cost is accepted
  # checksum: true      # IBAN / CZ account / rodne cislo / ABA
  # id: true            # issuer prefix + sequence counter
  # org_evidence: true  # gliner ORGANIZATION corroboration gate
  # allowlist: true     # technical-vocabulary suppression
  # validator: true     # post-mask leak check
  {}

gliner:

  # ── Size gate ─────────────────────────────────────────────────────────
  # Inputs longer than this many CHARACTERS skip gliner entirely; the other
  # detectors still run on them. 0 disables the gate.
  #
  # Characters, not bytes: this is the unit gliner.max_chars chunks on, and
  # it is counted on the text the stage receives, after custom/regex have
  # substituted placeholders.
  #
  # The rule is generic by design. gliner's cost is linear in input length
  # and independent of what it finds; its value is semantic spans in prose.
  # Large HTTP bodies are bundles, dumps and generated markup in every
  # application, so an unbounded input is unbounded cost for the layer's
  # worst use case. The threshold is where that stops being a judgement
  # call, not a rule about any particular app.
  #
  # 16384 measured on the 41 corpus messages above it: 391 tp with gliner,
  # 391 tp without — identical on every message, zero recall cost — 378
  # fewer over-masks, 1005s -> 23s. Gold prompts top out at 8210 chars, so
  # no prompt in the measured set is affected at all.
  #
  # Accepted residual risk, stated: a very large body carrying a client name
  # in running prose will not be seen by this layer.
  #
  # Set to 0 for any span-for-span comparison against an ungated
  # implementation.
  max_input_chars: 16384

  # ── ORGANIZATION evidence filter (stages/org_evidence.py) ─────────────
  # Read by the org_evidence stage, which runs in the full tier after the
  # detector slot.
  #
  # ORGANIZATION masking is EVIDENCE-REQUIRED rather than best-effort:
  # gliner proposes the span, and it is masked only if an independent
  # source says client. The custom stage carries the client's own name per
  # engagement, so this layer is the safety net, not the primary net.
  #
  #   E1  the span ends in an ISO 20275 / GLEIF legal form
  #   E2  the span shares a token with something already established as
  #       client identity in this chat (custom rule, masked hostname,
  #       email domain)
  #
  # Measured before shipping: E1 fires on 217/232 real legal entities and
  # 0/282 published technology terms in a probe fixture of published names,
  # and on 4 occurrences in the whole 1,060-message corpus. E2 fires on 16
  # of 23 gold ORG true positives and on 9 gold "false positives" that are
  # all unannotated client identity — and on none of the true noise.
  org_evidence:
    enabled: true

    # false = report only: keep every span, count what would have been
    # dropped. Run that first.
    require_evidence: true

    # Minimum token length for corroboration. Below 4 the shared fragments
    # stop being distinctive and anything corroborates anything.
    min_token_len: 4

    # Detectors whose findings may corroborate, matched against the
    # entity's `detector` field. HIGH CONFIDENCE ONLY — never another
    # span-NER guess, or one ORG hallucination corroborates the next and
    # the error compounds within a single chat.
    #
    # custom and regex run BEFORE the NER slot and their hits are already
    # placeholders in the text the slot sees, so they never appear in the
    # entity list. They reach E2 through the raw text instead, via
    # set_corroboration_context(). Listed here so the key reads as policy.
    corroborate_from: [checksum, keyval, id, opf, custom, regex, hostname]

    # Subtract published-allowlist tokens from the corroborating set, so a
    # public third-party domain in the traffic cannot vouch for a public
    # organisation name (github.com must not corroborate "GitHub").
    exclude_public_corroborators: true

    # A list generated from the GLEIF ELF code list. None ships in the
    # package today, so the module's seed forms are what runs — correct
    # but narrower: it misses forms from jurisdictions nobody hand-listed.
    elf_file: tests/allowlist/elf_forms.yaml

  # Per-label score thresholds, applied on top of the global threshold
  # (default 0.5). Only values ABOVE the global threshold have effect.
  #
  # ORGANIZATION at 0.60 removes ~950 corpus over-masks at zero gold-set
  # recall cost. It does NOT go higher: GLiNER's confidence tracks how
  # famous a name is, not whether it is client data. Measured on the gold
  # set, raising it further deletes the client identities first —
  # a bank's name falls at 0.65, then a capital-firm tenant slug at 0.70,
  # then a pharmacy's name and two more tenant slugs at 0.80 —
  # while sqlmap, soapenv, WSDL and Dalvik/2.1.0 survive to 0.90.
  #
  # PERSON is deliberately left at the global threshold: every step above
  # 0.50 costs real entities (a Czech surname at 0.673, a German
  # surname with title at 0.650),
  # and the identifier gate below removes more noise at zero recall cost.
  label_thresholds:
    ORGANIZATION: 0.60

    # CREDENTIAL disabled. A per-label threshold above 1.0 drops every span
    # of that label, since GLiNER scores never reach it.
    #
    # The label never did the job it is named for: across both datasets it
    # caught zero credentials. Its four sole gold claims are business IDs —
    # CC-EMEA-OPS-4421 (CONFIG_VALUE), EP-2019-0847 (SENSITIVE_FIELD),
    # usr-001-test (SENSITIVE_FIELD), ops_user_8814 (USER_ID) — and its
    # corpus catches are three trilium CONTEXTUAL_IDs plus the literal string
    # "password". Every one is an accidental span overlap, not a credential
    # detection. Cost: 665 corpus over-masks, the worst ratio in the stack
    # after ORGANIZATION.
    #
    # Suppressed here rather than removed from gliner.labels, deliberately.
    # The two are not equivalent: dropping the label from the inference-time
    # list stops GLiNER competing for those spans at all, so text that used
    # to score as credential can resurface under person or organization, and
    # ORGANIZATION has no shape gate to stop it absorbing them. A >1.0
    # threshold discards after scoring, so no other label's output moves.
    #
    # Known cost, accepted: 4 gold entities, recall 91.26% -> ~90.3%. Still
    # above the committed run10 bar of 89.20%. The queued business-ID regex
    # recovers CC-EMEA-OPS-4421 and EP-2019-0847 (uppercase prefix + digits);
    # usr-001-test and ops_user_8814 need the lowercase-prefix variant, which
    # is not written yet. Until it is, those two reach the AI unmasked.
    CREDENTIAL: 1.1

  # Identifier-shape suppression. See the long note in stages/gliner.py for
  # why the two labels get different rules and why this is never applied
  # to keyval / form / regex. Set a label to null to disable it.
  identifier_gates:
    PERSON:
      min_upper: 1
      require_lower_start: false
    ORGANIZATION:
      min_upper: 1
      require_lower_start: true
regex:

  # ── Null/empty value markers — never mask these ─────────────
  # Applied as a global filter to every regex match (built-in or custom).
  # Prevents nonsense like `originalCreator: [CREDENTIAL_1]` when the
  # underlying value was just `null` / `""` / `undefined`.
  #
  # Built-in defaults (always active) include: null, nil, none, undefined,
  # void, missing, true, false, n/a, na, nan, empty, blank, unset, unknown,
  # (null), <null>, [null], {null}, (none), <none>, [none], -, --, ---, ..., ***
  #
  # Surrounding quotes are stripped before comparison ("null" == null).
  # Comparison is case-insensitive.
  #
  # Add project-specific placeholders here (e.g., test data conventions).
  null_value_markers: []
    # - TBD
    # - REDACTED
    # - PLACEHOLDER
    # - XXX

  patterns:

    # ═══════════════════════════════════════════════════════════════
    # TIER 1: UNIQUE PREFIX PATTERNS (zero FP risk)
    # These have unique prefixes that never appear in non-sensitive data.
    # ═══════════════════════════════════════════════════════════════

    # ── JWT & Auth headers ──────────────────────────────────────
    # Capture groups: () wraps only the VALUE to mask.
    # The key/header name stays in the output for context.
    jwt_token:
      pattern: 'eyJ[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+'
      entity_type: "JWT_TOKEN"

    bearer_token:
      pattern: '(?i)Authorization:\s*Bearer\s+([A-Za-z0-9\-\._~+/]+=*)'
      entity_type: "BEARER_TOKEN"

    basic_auth:
      pattern: '(?i)basic\s+([A-Za-z0-9+/=]{20,})'
      entity_type: "BASIC_AUTH"

    digest_auth:
      pattern: '(?i)Authorization:\s*Digest\s+([^\r\n]+)'
      entity_type: "DIGEST_AUTH"

    ntlm_auth:
      pattern: '(?i)Authorization:\s*(?:NTLM|Negotiate)\s+([A-Za-z0-9+/=]{20,})'
      entity_type: "NTLM_AUTH"

    # ── API keys with unique prefixes ───────────────────────────
    api_key_header:
      pattern: '(?i)(?:x-api-key|api[_-]?key)\s*[:=]\s*([A-Za-z0-9_\-]{16,})'
      entity_type: "API_KEY"

    # AWS
    aws_access_key:
      pattern: '\b(?:AKIA|ASIA|AGPA|AIDA|AROA|AIPA|ANPA|ANVA|A3T[A-Z0-9])[0-9A-Z]{16}\b'
      entity_type: "AWS_ACCESS_KEY"

    aws_appsync_key:
      pattern: '\bda2-[a-z0-9]{26}\b'
      entity_type: "AWS_APPSYNC_KEY"

    aws_arn:
      pattern: 'arn:aws:[a-z0-9\-]+:[a-z0-9\-]*:\d{12}:[^\s"''<>]+'
      entity_type: "AWS_ARN"

    amazon_mws_token:
      pattern: 'amzn\.mws\.[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}'
      entity_type: "AMAZON_MWS_TOKEN"

    # Google / GCP
    google_api_key:
      pattern: '\bAIza[0-9A-Za-z_-]{35}\b'
      entity_type: "GOOGLE_API_KEY"

    google_oauth_token:
      pattern: '\bya29\.[0-9A-Za-z_-]+'
      entity_type: "GOOGLE_OAUTH_TOKEN"

    google_oauth_client:
      pattern: '\d+-[0-9A-Za-z_]{32}\.apps\.googleusercontent\.com'
      entity_type: "GOOGLE_OAUTH_CLIENT"

    gcp_service_account:
      pattern: '[a-z0-9\-]+@[a-z0-9\-]+\.iam\.gserviceaccount\.com'
      entity_type: "GCP_SERVICE_ACCOUNT"

    # GitHub / GitLab
    github_token:
      pattern: '\b(?:ghp|gho|ghs|ghr)_[A-Za-z0-9]{36,}\b'
      entity_type: "GITHUB_TOKEN"

    gitlab_token:
      pattern: '\bglpat-[A-Za-z0-9\-]{20,}\b'
      entity_type: "GITLAB_TOKEN"

    # Payment providers
    stripe_key:
      pattern: '\b(?:sk|pk|rk)_(?:live|test)_[A-Za-z0-9]{24,}\b'
      entity_type: "STRIPE_KEY"

    square_access_token:
      pattern: '\bsq0atp-[0-9A-Za-z_-]{22}\b'
      entity_type: "SQUARE_TOKEN"

    square_oauth_secret:
      pattern: '\bsq0csp-[0-9A-Za-z_-]{43}\b'
      entity_type: "SQUARE_SECRET"

    paypal_braintree_token:
      pattern: 'access_token\$production\$[0-9a-z]{16}\$[0-9a-f]{32}'
      entity_type: "PAYPAL_TOKEN"

    # Communication / SaaS
    slack_token:
      pattern: 'xox[pborsa]-[0-9]{10,13}-[0-9]{10,13}-[a-zA-Z0-9]{24,}'
      entity_type: "SLACK_TOKEN"

    slack_webhook:
      pattern: 'https://hooks\.slack\.com/services/T[a-zA-Z0-9_]{8,}/B[a-zA-Z0-9_]{8,}/[a-zA-Z0-9_]{24}'
      entity_type: "SLACK_WEBHOOK"

    discord_webhook:
      pattern: 'https://discord(?:app)?\.com/api/webhooks/\d+/[A-Za-z0-9_-]+'
      entity_type: "DISCORD_WEBHOOK"

    telegram_bot_token:
      pattern: '\b[0-9]+:AA[0-9A-Za-z_-]{33}\b'
      entity_type: "TELEGRAM_TOKEN"

    twilio_api_key:
      pattern: '\bSK[0-9a-fA-F]{32}\b'
      entity_type: "TWILIO_KEY"

    twilio_sid:
      pattern: '\bAC[0-9a-fA-F]{32}\b'
      entity_type: "TWILIO_SID"

    sendgrid_key:
      pattern: '\bSG\.[A-Za-z0-9_-]{20,}\.[A-Za-z0-9_-]{20,}\b'
      entity_type: "SENDGRID_KEY"

    mailchimp_key:
      pattern: '\b[0-9a-f]{32}-us[0-9]{1,2}\b'
      entity_type: "MAILCHIMP_KEY"

    mailgun_key:
      pattern: '\bkey-[0-9a-zA-Z]{32}\b'
      entity_type: "MAILGUN_KEY"

    # Package managers / DevOps
    npm_token:
      pattern: '\bnpm_[A-Za-z0-9]{36}\b'
      entity_type: "NPM_TOKEN"

    pypi_token:
      pattern: '\bpypi-[A-Za-z0-9_-]{50,}\b'
      entity_type: "PYPI_TOKEN"

    dockerhub_token:
      pattern: '\bdckr_pat_[A-Za-z0-9_-]{20,}\b'
      entity_type: "DOCKER_TOKEN"

    digitalocean_token:
      pattern: '\bdop_v1_[a-f0-9]{64}\b'
      entity_type: "DIGITALOCEAN_TOKEN"

    # Cryptographic material
    private_key_rsa:
      pattern: '-----BEGIN RSA PRIVATE KEY-----'
      entity_type: "PRIVATE_KEY"

    private_key_dsa:
      pattern: '-----BEGIN DSA PRIVATE KEY-----'
      entity_type: "PRIVATE_KEY"

    private_key_ec:
      pattern: '-----BEGIN EC PRIVATE KEY-----'
      entity_type: "PRIVATE_KEY"

    private_key_openssh:
      pattern: '-----BEGIN OPENSSH PRIVATE KEY-----'
      entity_type: "PRIVATE_KEY"

    pgp_private_key:
      pattern: '-----BEGIN PGP PRIVATE KEY BLOCK-----'
      entity_type: "PGP_PRIVATE_KEY"

    ssh_public_key:
      pattern: '(?:ssh-rsa|ssh-ed25519|ssh-dss|ecdsa-sha2-nistp\d+)\s+[A-Za-z0-9+/=]{40,}'
      entity_type: "SSH_KEY"

    # Error tracking / monitoring
    sentry_dsn:
      pattern: 'https://[a-f0-9]+@[a-z0-9]+\.ingest\.sentry\.io/\d+'
      entity_type: "SENTRY_DSN"

    # Firebase / GCP mobile
    firebase_key:
      pattern: '(?i)\?key=[A-Za-z0-9_\-]{30,}'
      entity_type: "FIREBASE_API_KEY"

    gmpid:
      pattern: '\b\d+:\d+:(?:android|ios|web):[a-f0-9]+'
      entity_type: "FIREBASE_GMPID"

    # Session / identifiers
    session_id:
      pattern: '(?i)(?:session[_-]?id|jsessionid|phpsessid|asp\.net_sessionid)\s*[=:]\s*([A-Za-z0-9_\-\.]{16,})'
      entity_type: "SESSION_ID"

    csrf_token:
      pattern: '(?i)(?:x-?csrf[_-]?token|xsrf[_-]?token|csrf[_-]?token|_csrf|__RequestVerificationToken)\s*[=:]\s*([A-Za-z0-9_\-\.+/]{8,})'
      entity_type: "CSRF_TOKEN"

    uuid:
      pattern: '\b[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}\b'
      entity_type: "UUID"

    # Host header — always mask the Host value.
    #
    # Two alternatives, in order. The first is the RFC 3986 §3.2.2 IP-literal
    # form `[::1]` / `[2001:db8::1]:8443`: an IPv6 host is written inside
    # brackets BECAUSE its colons would otherwise be read as the port
    # separator, and `[^\s:]+` stops at the first colon, so the old pattern
    # captured `[` alone and masked nothing useful. The bracketed form is
    # matched whole, port included. The second is the original name-or-IPv4
    # branch, unchanged.
    host_header:
      pattern: '(?:^|\n)Host:\s*(\[[0-9A-Fa-f:.]+\](?::\d+)?|[^\s:]+(?::\d+)?)'
      entity_type: "INTERNAL_HOSTNAME"

    # Network
    internal_ip:
      pattern: '\b(?:10\.\d{1,3}\.\d{1,3}\.\d{1,3}|172\.(?:1[6-9]|2\d|3[01])\.\d{1,3}\.\d{1,3}|192\.168\.\d{1,3}\.\d{1,3})\b'
      entity_type: "INTERNAL_IP"

    ipv6_internal:
      pattern: '\b(?:fe80|fd[0-9a-f]{2}):[0-9a-f:]{4,}\b'
      entity_type: "INTERNAL_IP"

    # The group MUST be non-capturing. It was `(...)` and it is quantified
    # {5}, so Python kept only the LAST repetition: stages/regex.py reads
    # match.lastindex, masked `3A:` instead of `00:1B:44:11:3A:B7`, and the
    # masker then dropped that at the 3-char edge-stripped floor. Net effect:
    # every MAC was DETECTED and then vanished — not in mask_map, not in
    # masker_unmasked, not in validation. A silent total loss with no
    # telemetry anywhere. (masker.py's own docstring cites the symptom,
    # "21: clipped from a MAC by an over-eager detector", and attributes it
    # to the detector rather than to this group.)
    mac_address:
      pattern: '\b(?:[0-9A-Fa-f]{2}[:-]){5}[0-9A-Fa-f]{2}\b'
      entity_type: "DEVICE_INFO"
      context: ["mac", "MAC", "primary_mac", "mac_address", "hardware", "ethernet", "wifi", "wireless", "nic", "interface"]

    # Hashes
    bcrypt_hash:
      pattern: '\$2[aby]?\$\d{1,2}\$[A-Za-z0-9./]{53}'
      entity_type: "PASSWORD_HASH"

    argon2_hash:
      pattern: '\$argon2(?:i|d|id)\$[^\s"'',&;|#<>]{20,}'
      entity_type: "PASSWORD_HASH"

    unix_crypt_md5:
      pattern: '\$1\$[A-Za-z0-9./]{1,8}\$[A-Za-z0-9./]{22}'
      entity_type: "PASSWORD_HASH"

    unix_crypt_sha256:
      pattern: '\$5\$(?:rounds=\d+\$)?[A-Za-z0-9./]{1,16}\$[A-Za-z0-9./]{43}'
      entity_type: "PASSWORD_HASH"

    unix_crypt_sha512:
      pattern: '\$6\$(?:rounds=\d+\$)?[A-Za-z0-9./]{1,16}\$[A-Za-z0-9./]{86}'
      entity_type: "PASSWORD_HASH"

    scrypt_hash:
      pattern: '\$scrypt\$[^\s"'',&;|#<>]{20,}'
      entity_type: "PASSWORD_HASH"

    pbkdf2_hash:
      pattern: '(?i)pbkdf2[_:]sha(?:1|256|512)[:\$][^\s"'',&;|#<>]{20,}'
      entity_type: "PASSWORD_HASH"

    sha1_hash:
      pattern: '\b[a-f0-9]{40}\b'
      entity_type: "HASH"
      context: ["sha1", "SHA1", "sha-1", "SHA-1", "hash", "digest", "checksum", "fingerprint", "signature"]

    sha512_hash:
      pattern: '\b[a-f0-9]{128}\b'
      entity_type: "HASH"
      context: ["sha512", "SHA512", "sha-512", "SHA-512", "hash", "digest", "checksum"]

    ntlm_hash:
      pattern: '\b[a-fA-F0-9]{32}\b'
      entity_type: "HASH"
      context: ["NTLM", "ntlm", "NT Hash", "LM Hash", "NTHash", "LMHash"]


    # ═══════════════════════════════════════════════════════════════
    # TIER 2: CONTEXT-AWARE PATTERNS (near-zero FP with context)
    # These match generic formats but require nearby keywords.
    # ═══════════════════════════════════════════════════════════════

    # ── Credentials in key-value formats ────────────────────────
    # Capture is quote-AWARE, not just quote-tolerant: a quoted value
    # (`"..."`, `'...'`, `` `...` ``) is bounded by its OWN matching
    # quote, so internal delimiter chars like & or | inside a real
    # quoted JSON string don't truncate it early. An unquoted value
    # (form-urlencoded, headers) is bounded by the delimiter class,
    # which excludes whitespace/quotes/braces/commas AND field
    # separators & ; | plus angle-brackets < > (so markup like
    # `</strong>` can't be captured as a value). '#' is intentionally
    # ALLOWED so passwords like `Pentest#123` mask whole. Without the
    # separators, `username=test&user_id=1`
    # captures "test&user_id=1" as ONE value, silently eating every
    # field after it instead of stopping at the delimiter.
    # stages/regex.py picks whichever of the 4 alternative groups fired
    # via match.lastindex — only one is ever non-None per match.
    password_value:
      pattern: '(?i)\b(?:password|passwd|pwd|secret|passphrase)\s*["''`]?\s*[:=]\s*(?:"([^"\n]{3,})"|''([^''\n]{3,})''|`([^`\n]{3,})`|([^\s"''`\n,}{&;|<>]{3,}))'
      entity_type: "CREDENTIAL"

    # Username/user fields — same quote-aware approach as password.
    # user_id/uid/employeeNumber intentionally excluded — those are
    # identifiers, not usernames, and get their own type below so
    # agents don't conflate a numeric user_id with a real username.
    username_value:
      pattern: '(?i)\b(?:username|user_?name|login|preferred_?username)\s*["''`]?\s*[:=]\s*(?:"([^"\n]{2,})"|''([^''\n]{2,})''|`([^`\n]{2,})`|([^\s"''`\n,}{&;|<>]{2,}))'
      entity_type: "USERNAME"

    # Numeric/opaque identifiers — separate namespace from USERNAME so
    # `user_id=7` doesn't collide with `username=alice` and mislead
    # agents into treating an ID field as a username field.
    user_id_value:
      pattern: '(?i)\b(?:user_?id|uid|employeeNumber|employee_?number|account_?id|customer_?id)\s*["''`]?\s*[:=]\s*(?:"([^"\n]{1,})"|''([^''\n]{1,})''|`([^`\n]{1,})`|([^\s"''`\n,}{&;|<>]{1,}))'
      entity_type: "USER_ID"

    # Person names in JSON/XML fields
    name_value:
      pattern: '(?i)(?:fullName|full_name|firstName|first_name|lastName|last_name|displayName|display_name|givenName|given_name|familyName|family_name)\s*["''`]?\s*[:=]\s*["''`]([^"''`\n]{2,50})["''`]'
      entity_type: "PERSON_NAME"

    # Catches: client_secret=xxx, auth_token=xxx, refresh_token=xxx
    secret_value:
      pattern: '(?i)\b(?:client[_-]?secret|app[_-]?secret|secret[_-]?key|auth[_-]?token|access[_-]?token|refresh[_-]?token|private[_-]?key)\s*[":=]+\s*["''`]?([A-Za-z0-9_\-\.+/=]{8,})["''`]?'
      entity_type: "CREDENTIAL"

    # Password embedded in URL: protocol://user:password@host
    # Captures only the password between : and @
    password_in_url:
      pattern: '[a-zA-Z]{3,10}://[^/\s:@]{3,20}:([^/\s:@]{3,20})@'
      entity_type: "CREDENTIAL"

    # OAuth token in URL params: ?access_token=xxx or &token=xxx
    oauth_url_token:
      pattern: '(?i)[?&](?:access_token|token|auth_token|api_token|apikey)=([A-Za-z0-9_\-\.]{16,})'
      entity_type: "URL_TOKEN"

    # ── Connection strings ──────────────────────────────────────
    db_connection_string:
      pattern: '(?i)(?:postgres(?:ql)?|mysql|mongodb(?:\+srv)?|mssql|jdbc:[a-z]+)://[^\s"''<>]{10,}'
      entity_type: "CONNECTION_STRING"

    cache_connection_string:
      pattern: '(?i)(?:redis(?:s)?|amqps?|memcached)://[^\s"''<>]{10,}'
      entity_type: "CONNECTION_STRING"

    # ── Cloud configuration ─────────────────────────────────────
    azure_connection_string:
      pattern: '(?i)(?:DefaultEndpointsProtocol|AccountKey|SharedAccessSignature)\s*=\s*([^\s;"]+)'
      entity_type: "AZURE_CREDENTIAL"

    azure_tenant_id:
      pattern: '(?i)(?:tenant[_-]?id|client[_-]?id|subscription[_-]?id)\s*[=:"]+\s*([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})'
      entity_type: "AZURE_ID"

    # ── Long cookie values (auth cookies) ───────────────────────
    # Non-capturing group for cookie name, capturing group for value only.
    # Result: "iPlanetDirectoryPro=[AUTH_COOKIE_1]" (name preserved)
    auth_cookie:
      pattern: '\b(?:[A-Za-z][A-Za-z0-9_.-]{2,})=([A-Za-z0-9_\-\.+/*=\*%]{20,})'
      entity_type: "AUTH_COOKIE"
      context: ["Cookie", "Set-Cookie", "cookie"]

    # ── LDAP / Active Directory ─────────────────────────────────
    ldap_dn:
      pattern: '(?i)(?:CN|UID)=[^,\n"}<]+(?:,\s*(?:OU|CN|DC)=[^,\n"}<]+){2,}'
      entity_type: "LDAP_DN"

    # ── Infrastructure / hostnames ──────────────────────────────
    # The suffix must be a COMPLETE DNS label. Without the (?![\w\-]) guard
    # the alternation matched inside ordinary words — "priv" inside
    # private_key_jwt, "local" inside locality, "internal" inside
    # internal_tooltip — which turned i18n message keys such as
    # visibility.private.description.short into INTERNAL_HOSTNAME.
    # The private suffix must be the FINAL label of the name.
    #
    # The trailing (?:\.[\w\-]+)* used to let the keyword match an INTERIOR
    # label, so qa.corp.stripe.com and punctual.corp.google.com were masked --
    # both are ordinary registrable domains under a delegated TLD that happen
    # to use "corp" as a subdomain. That is the same "mask unless I recognise
    # it" rule we removed from the original hostname stage, reappearing one level down.
    #
    # Anchoring the keyword at the end keeps the cases that are private by
    # construction (nothing is registrable under .corp / .local / .internal)
    # and drops the ones that are just a third party's naming convention.
    # Client-owned public domains are the custom stage's job.
    internal_domain:
      pattern: '\b[a-z0-9][\w\-]*(?:\.[\w\-]+)*\.(?:internal|local|corp|intranet|priv|staging|nonprod)(?![\w\-])(?!\.[\w\-])'
      entity_type: "INTERNAL_HOSTNAME"

    k8s_service:
      pattern: '\b[a-z0-9\-]+\.[a-z0-9\-]+\.svc\.cluster\.local\b'
      entity_type: "INTERNAL_HOSTNAME"

    # ── File paths (server structure exposure) ──────────────────
    # Linux: any absolute path under FHS-standard top-level dirs.
    # Catches LFI targets (/etc/passwd, /proc/self/*), stack traces,
    # error messages, config dumps, web roots (/var/www/*), home dirs.
    # Roots covered: var, usr, opt, srv, etc, home, tmp, root, run,
    # mnt, media, boot, proc, sys, lib, lib64, snap, dev, app.
    # /app is the default WORKDIR of the official Docker images for
    # Python, Node and .NET, so it is where containerised apps leak
    # their source tree from -- stack traces, file-manager APIs,
    # template errors. Not an FHS root, but as common as /var/www in
    # modern deployments.
    # Deliberately NOT covered: /data, /static, /assets, /public,
    # /uploads, /files, /api. Those are URL route prefixes far more
    # often than filesystem roots (/data/... is a Next.js data route),
    # and the leading guard cannot tell the two apart at position 0.
    # Char class excludes whitespace/quotes/angle-brackets/colon — colon
    # exclusion stops matches at log separators ("/var/log/auth.log: error").
    # The leading (?<![\w/.~\-]) anchors the match at the START of a path.
    #
    # Without it the root alternation matched an INTERIOR segment of a URL:
    # in ".../styles/np8_full/s3/media/2021/07/screenshot.png" it started at
    # "/media/", so the masker left "s3[FILE_PATH_1]" -- a digit fused to a
    # placeholder, which the corruption detector flags. It also produced
    # partial matches like "/home/runn" out of longer URL paths.
    #
    # A real filesystem path is preceded by whitespace, a quote, "=", "(",
    # ":" or start-of-line -- never by another path character. URL paths such
    # as "https://host/etc/passwd" are therefore no longer treated as server
    # filesystem disclosure, while "?file=/etc/passwd" and
    # "GET /etc/passwd HTTP/1.1" still match.
    server_file_path:
      pattern: '(?<![\w/.~\-])(?:/var/|/usr/|/opt/|/srv/|/etc/|/home/|/tmp/|/root/|/run/|/mnt/|/media/|/boot/|/proc/|/sys/|/lib/|/lib64/|/snap/|/dev/|/app/)[^\s"''<>:]{3,}'
      entity_type: "FILE_PATH"

    # Windows: any drive letter + path. Matches C:\, D:\, E:\, F:\, etc.
    # Any disk path in HTTP traffic exposes server structure.
    # \b prevents mid-word matches (e.g., "myC:\path"). Spaces in paths
    # only work inside quoted contexts — same limitation as before.
    windows_file_path:
      pattern: '\b[A-Z]:\\[^\s"''<>]{3,}'
      entity_type: "FILE_PATH"

    # ── Hashes with context ─────────────────────────────────────
    aws_secret_key:
      pattern: '\b[0-9a-zA-Z/+=]{40}\b'
      entity_type: "AWS_SECRET_KEY"
      context: ["SecretAccessKey", "AWS_SECRET", "aws_secret_access_key", "secret_access_key"]

    android_cert:
      pattern: '\b[A-F0-9]{40}\b'
      entity_type: "ANDROID_CERT_HASH"
      context: ["X-Android-Cert", "cert", "SHA1", "SHA-1", "fingerprint", "signing"]

    hex_secret:
      pattern: '\b[0-9a-f]{64}\b'
      entity_type: "HEX_SECRET"
      context: ["secret", "key", "hash", "hmac", "token", "signature", "encryption", "salt"]

    md5_hash:
      pattern: '\b[a-f0-9]{32}\b'
      entity_type: "HASH"
      context: ["md5", "MD5", "hash", "password", "digest", "checksum"]

    # ── SSO / SAML ──────────────────────────────────────────────
    saml_assertion:
      pattern: '\bPHNhbWx[A-Za-z0-9+/=]{50,}'
      entity_type: "SAML_ASSERTION"

    # ── Generic webhook URL ─────────────────────────────────────
    webhook_url:
      pattern: '(?i)(?:webhook|callback|hook)[_\-]?(?:url|endpoint)\s*[=:"]+\s*(https?://[^\s"''<>]+)'
      entity_type: "WEBHOOK_URL"

    # ── Google service account JSON marker ──────────────────────
    gcp_service_account_json:
      pattern: '"type"\s*:\s*"service_account"'
      entity_type: "GCP_SERVICE_ACCOUNT"

    # ── Heroku API key ──────────────────────────────────────────
    heroku_key:
      pattern: '(?i)heroku[^\n]{0,40}([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})'
      entity_type: "HEROKU_KEY"

    # ── Facebook ────────────────────────────────────────────────
    facebook_access_token:
      pattern: 'EAACEdEose0cBA[0-9A-Za-z]+'
      entity_type: "FACEBOOK_TOKEN"


    # ═══════════════════════════════════════════════════════════════
    # TIER 3: MULTI-COUNTRY PII PATTERNS (CZ/SK/DE/US)
    # ═══════════════════════════════════════════════════════════════

    # ── Czech Republic ──────────────────────────────────────────
    # Rodné číslo: YYMMDD/XXXX (month +50 for women)
    rodne_cislo:
      pattern: '\b\d{2}(?:0[1-9]|1[0-2]|5[1-9]|6[0-2])(?:0[1-9]|[12]\d|3[01])/?\d{3,4}\b'
      entity_type: "CZ_RODNE_CISLO"

    # DIČ: CZ + 8-10 digits
    dic:
      pattern: '\bCZ\d{8,10}\b'
      entity_type: "CZ_DIC"

    # IČO: 8 digits (needs context — any 8-digit number would match)
    ico:
      pattern: '\b\d{8}\b'
      entity_type: "CZ_ICO"
      context: ["IČO", "IČ", "ico", "company", "registration", "s.r.o.", "a.s."]

    # Czech phone: +420 xxx xxx xxx
    phone_czech:
      pattern: '(?:\+420|00420)[\s\-]?\d{3}[\s\-]?\d{3}[\s\-]?\d{3}'
      entity_type: "PHONE_NUMBER"

    # ── Slovakia ────────────────────────────────────────────────
    # Slovak rodné číslo: same format as Czech
    # (already covered by rodne_cislo above)

    # Slovak phone: +421 xxx xxx xxx
    phone_slovak:
      pattern: '(?:\+421|00421)[\s\-]?\d{3}[\s\-]?\d{3}[\s\-]?\d{3}'
      entity_type: "PHONE_NUMBER"

    # Slovak DIČ: SK + 10 digits
    sk_dic:
      pattern: '\bSK\d{10}\b'
      entity_type: "SK_DIC"

    # ── Germany ─────────────────────────────────────────────────
    # Steuerliche Identifikationsnummer (Tax ID): 11 digits
    de_steuer_id:
      pattern: '\b\d{11}\b'
      entity_type: "DE_STEUER_ID"
      context: ["Steuer", "steuer", "TIN", "Identifikationsnummer", "IdNr", "tax"]

    # Sozialversicherungsnummer: 2 digits + letter + 7 digits + letter (12 chars)
    de_svnr:
      pattern: '\b\d{2}[A-Z]\d{7}[A-Z]\b'
      entity_type: "DE_SOZIALVERSICHERUNG"

    # German phone: +49 xxx xxxxxxx
    phone_german:
      pattern: '(?:\+49|0049)[\s\-]?\d{2,4}[\s\-]?\d{4,8}'
      entity_type: "PHONE_NUMBER"

    # German IBAN: DE + 2 check + 18 digits
    iban_de:
      pattern: '\bDE\d{2}\s?\d{4}\s?\d{4}\s?\d{4}\s?\d{4}\s?\d{2}\b'
      entity_type: "IBAN"

    # ── United States ───────────────────────────────────────────
    # SSN: XXX-XX-XXXX
    us_ssn:
      pattern: '\b\d{3}-\d{2}-\d{4}\b'
      entity_type: "US_SSN"
      context: ["SSN", "ssn", "social security", "Social Security"]

    # EIN (Employer Identification Number): XX-XXXXXXX
    us_ein:
      pattern: '\b\d{2}-\d{7}\b'
      entity_type: "US_EIN"
      context: ["EIN", "ein", "employer", "Employer", "tax"]

    # US phone: +1 (XXX) XXX-XXXX or similar
    phone_us:
      pattern: '(?:\+1|001)[\s\-]?\(?\d{3}\)?[\s\-]?\d{3}[\s\-]?\d{4}'
      entity_type: "PHONE_NUMBER"

    # ── International / Generic ─────────────────────────────────
    # Email (backup for Presidio misses — runs before NER)
    #
    # The separator accepts the percent-encoded forms as well as a literal @.
    # Emails cross the wire encoded constantly: query strings, form bodies
    # (application/x-www-form-urlencoded), redirect params, cookie values.
    # Without this, defaultuser%40changedetection.io is invisible to every
    # layer — 2 of the corpus false negatives were exactly this.
    # %2540 is listed FIRST so it wins the alternation over %40 on a
    # double-encoded value (%25 is itself an encoded %).
    email_address:
      pattern: '[A-Za-z0-9._%+\-]+(?:@|%2540|%40)[A-Za-z0-9.\-]+\.[A-Za-z]{2,}'
      entity_type: "EMAIL_ADDRESS"

    # International phone: +XX followed by 7-14 digits
    phone_international:
      pattern: '\+\d{1,3}(?:[\s\-]?\d){7,14}'
      entity_type: "PHONE_NUMBER"

    # IBAN (generic European): 2 letter country + 2 check + up to 30 alphanumeric
    iban_generic:
      pattern: '\b[A-Z]{2}\d{2}\s?\d{4}\s?\d{4}\s?\d{4}\s?\d{4}\s?\d{0,4}\b'
      entity_type: "IBAN"

    # ── Date of birth (context-gated: masks a date ONLY when a birth cue
    #    is within 50 chars, so ordinary timestamps/expiry dates are left alone).
    #    Covers EN / CZ / SK + major EU languages and Czech 'Datum nar.' abbreviations.
    #    Whole-match (no capture group) -> the date is masked, the key stays as context.
    date_of_birth:
      pattern: '\b(?:(?:19|20)\d{2}-(?:0[1-9]|1[0-2])-(?:0[1-9]|[12]\d|3[01])|(?:0?[1-9]|[12]\d|3[01])\.\s?(?:0?[1-9]|1[0-2])\.\s?(?:19|20)\d{2}|(?:0?[1-9]|[12]\d|3[01])/(?:0?[1-9]|1[0-2])/(?:19|20)\d{2})\b'
      entity_type: "DATE_OF_BIRTH"
      context: ["birth", "dob", "d.o.b", "born", "bday", "b_date", "naroz", "naroden", "datumnar", "datum_nar", "datum nar", "dat. nar", "dat.nar", "geburt", "gebor", "geboort", "naissance", "nacimiento", "nacid", "nascita", "nascimento", "urodz", "szület", "naster"]

    # ── NOT included (LLM territory) ──────────────────────────
    # Hostnames/domains: too many FP in HTTP traffic. Let LLM handle.
    # Arbitrary passwords: no reliable pattern. Let LLM handle.
    # Custom headers (X-Client-Company etc.): too specific. Let LLM handle.

# --- Intrinsic-form detection (stages/form.py) ---
# Keys on what a value IS, mathematically, rather than where it sits or what it
# means: mod-97/Luhn/Verhoeff checksums, published format grammars (JWT, PEM,
# UUID, SID, ARN, MAC), and a randomness net for everything unenumerable.
#
# entropy_method — PRODUCTION RUNS BPE-ONLY.
#   bpe      chars-per-cl100k-token below bpe_threshold. Random secrets have no
#            learned merges and shred into short tokens; word-like identifiers
#            do not. 98.6% vs 70.4% recall on CredData against Shannon.
#   shannon  character-level entropy only. Kept for benchmark comparison.
#   both     Shannon gated BY BPE (intersection, never a union).
#   off      checksums and format standards only, no randomness net.
# shannon/both are for measurement comparisons; leave this line at bpe.
#
# The BPE path needs tiktoken's cl100k_base encoding on disk. If it cannot be
# loaded the stage refuses to run (EncoderUnavailableError) rather than fall
# back to Shannon; set entropy_method: shannon explicitly if you mean to run
# without it.
form:
  entropy_method: bpe
  bpe_threshold: 2.2      # chars/token; values BELOW this fire
  min_entropy_len: 20     # noise floor for entropy candidates
  # Only consulted when entropy_method is shannon or both:
  shannon_base64: 4.5     # detect-secrets --base64-limit
  shannon_hex: 3.0        # detect-secrets --hex-limit
allowlist:
  enabled: true
  # path: allowlist   # file or directory; relative paths resolve from
                      # the package directory, not the CWD. Defaults to
                      # the package's own allowlist directory.

# --- Masking settings ---
masking:
  # Format for placeholder names. {type} and {index} are filled in.
  # Example: [EMAIL_ADDRESS_1], [PERSON_2], [JWT_TOKEN_1]
  placeholder_format: "[{type}_{index}]"

  # If true: same text always gets same placeholder within one request.
  # "jan.novak@acme.cz" appearing 3 times → always [EMAIL_ADDRESS_1]
  # This preserves referential integrity in the masked output.
  consistent_mapping: true
