# Release on a version tag: vX.Y.Z -> PyPI X.Y.Z and two images on ghcr.io.
#
#   git tag vX.Y.Z && git push origin vX.Y.Z
#
# One-time setup, outside this file:
#   PyPI   add a "trusted publisher" for project `maskerade`:
#          owner adamectimotei, repository maskerade-proxy,
#          workflow release.yml, environment pypi.
#          No API token is stored anywhere.
#   GitHub create an environment named `pypi` (Settings > Environments).
#          Optional: add yourself as a required reviewer, so every PyPI
#          upload waits for a click.
#
# Kept minimal on purpose: a broken release workflow is worse than a manual
# release. Each third-party action is pinned to a full commit SHA, with the
# release it came from in a comment. To move one, resolve the new release's
# commit with `git ls-remote --tags https://github.com/OWNER/REPO` and
# replace both the SHA and the comment.

name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Tag must match maskerade.__version__
        id: v
        run: |
          v=$(python -c "import ast;t=ast.parse(open('maskerade/__init__.py').read());print(next(n.value.value for n in t.body if isinstance(n,ast.Assign) and n.targets[0].id=='__version__'))")
          [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME != __version__ $v"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check dist/*
      - name: Package data present in BOTH artifacts
        run: |
          python - <<'EOF'
          import glob, tarfile, zipfile
          need = ["maskerade/default_config.yaml",
                  "maskerade/allowlist/allowlist.yaml",
                  "maskerade/allowlist/allowlist_overrides.yaml",
                  "maskerade/stages/allowlist/allowlist.yaml",
                  "maskerade/stages/allowlist/allowlist_overrides.yaml",
                  "maskerade/proxy/system_note.txt"]
          w = set(zipfile.ZipFile(glob.glob("dist/*.whl")[0]).namelist())
          s = {n.split("/", 1)[1] for n in tarfile.open(glob.glob("dist/*.tar.gz")[0]).getnames() if "/" in n}
          miss = [p for p in need if p not in w] + [p for p in need if p not in s]
          assert not miss, miss
          print("all package data present in wheel and sdist")
          EOF
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist
          path: dist/

  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write          # trusted publishing; nothing else
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  images:
    # After PyPI, so an image never exists for a version that failed to
    # publish.
    needs: [build, pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/adamectimotei/maskerade
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Light image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          target: light
          build-args: VERSION=${{ env.VERSION }}
          tags: ${{ env.IMAGE }}:${{ env.VERSION }}
          push: true
          provenance: false
      - name: NER image (model baked in)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          target: ner
          build-args: VERSION=${{ env.VERSION }}
          tags: ${{ env.IMAGE }}:${{ env.VERSION }}-ner
          push: true
          provenance: false
